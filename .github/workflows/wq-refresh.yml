name: Refresh water quality data

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC (7am ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/wq_pipeline.py --days 365 --featured 8
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wq-data.js wq/img
          if git diff --cached --quiet; then
            echo "No new satellite passes."
          else
            git commit -m "Refresh water quality data from latest Sentinel-2 passes"
            git push
          fi
